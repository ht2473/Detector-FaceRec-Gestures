# Detector + FaceRec + Gestures — default configuration
app:
  name: "Detector + FaceRec + Gestures"
  version: "2.2.0"
  author: "Robot"

model:
  default: "yolo26s.pt"
  auto_download: false

detection:
  confidence_threshold: 0.25
  iou_threshold: 0.45
  image_size: 640

face_recognition:
  det_threshold: 0.50
  rec_similarity: 0.35
  face_db_dir: "FaceDB"
  image_size: 320
  skip_frames: 3

gesture:
  min_detection_confidence: 0.50
  min_tracking_confidence: 0.50
  max_num_hands: 2

device:
  prefer: "auto"   # auto | cpu | cuda

export:
  save_video: true
  save_json: true
  output_dir: "output"